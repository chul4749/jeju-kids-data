name: collect

# 1시간마다 제주 행사·장소·날씨를 모아 GitHub Pages(…/v1/*.json)로 공개한다. 앱은 이 파일만 받는다.
on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분(정각은 GitHub가 붐벼 지연이 잦다)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 지난 실행까지 모은 캐시(행사 기간·위치·후기·사진 등)를 이어받는다.
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: collect-cache-${{ github.run_id }}
          restore-keys: collect-cache-
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          VISITJEJU_KEY: ${{ secrets.VISITJEJU_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          BUDGET: "1"
        run: ./gradlew run -q --args="site/v1 cache"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: collect-cache-${{ github.run_id }}
      - name: Static pages
        run: cp -r static/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
